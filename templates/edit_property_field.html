{% extends "base.html" %}

{% block title %}フィールド編集 - 在庫管理システム{% endblock %}
{% block page_title %}物性値フィールド編集{% endblock %}

{% block content %}
<div style="max-width:480px;">
    <div class="card">
        <div class="card-header">
            <i class="bi bi-pencil-square me-2 text-warning"></i>フィールド情報編集
        </div>
        <div class="card-body">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3" style="font-size:0.85rem;color:var(--text-secondary);">
                    {% if field.label %}
                    <span class="badge" style="background-color:{{ field.label.color }};">
                        <i class="bi bi-tag-fill me-1"></i>{{ field.label.name }}
                    </span>
                    {% else %}
                    <span class="badge bg-secondary">ラベルなし</span>
                    {% endif %}
                </div>

                <div class="mb-4">
                    <label class="form-label">フィールド名 <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control"
                           value="{{ field.name }}" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">型</label>
                    <select name="field_type" class="form-select">
                        <option value="string" {% if field.field_type == 'string' %}selected{% endif %}>
                            文字列（テキスト）
                        </option>
                        <option value="number" {% if field.field_type == 'number' %}selected{% endif %}>
                            数値
                        </option>
                        <option value="date" {% if field.field_type == 'date' %}selected{% endif %}>
                            日付（カレンダー）
                        </option>
                    </select>
                    <div class="form-text">
                        型を変更すると、既存の物性値データは変換されません（数値→文字列は数値として保持されます）
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">単位（任意）</label>
                    <input type="text" name="unit" class="form-control"
                           value="{{ field.unit or '' }}"
                           placeholder="例: °C, g/mL, %, nm">
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle me-1"></i>更新
                    </button>
                    <a href="{{ url_for('property_templates') }}" class="btn btn-outline-secondary">キャンセル</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
