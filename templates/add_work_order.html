{% extends "base.html" %}

{% block title %}新規作業追加 - 在庫管理システム{% endblock %}
{% block page_title %}新規作業追加{% endblock %}

{% block content %}
<!-- アドレス帳datalist -->
<datalist id="contactsList">
    {% for c in contacts %}
    <option value="{{ c.name }}">
    {% endfor %}
</datalist>

<div style="max-width:640px;">
    <div class="card">
        <div class="card-header">
            <i class="bi bi-plus-circle me-2 text-primary"></i>作業工程の登録
        </div>
        <div class="card-body">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <!-- 作業工程名 -->
                <div class="mb-3">
                    <label class="form-label">作業工程名 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="process_name"
                           placeholder="例: ロットA製造" required autofocus
                           value="{{ request.form.get('process_name','') }}">
                </div>

                <div class="mb-3">
                    <div class="p-2 rounded d-flex align-items-center gap-2"
                         style="background:#f8fafc;border:1px solid var(--border-color);font-size:0.82rem;color:var(--text-secondary);">
                        <i class="bi bi-info-circle text-primary"></i>
                        ステータスは<strong class="text-primary mx-1">実際の開始日・完了日</strong>から自動判定されます（開始日入力→作業中、完了日入力→完了）
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">優先度</label>
                    <select class="form-select" name="priority">
                        <option value="none"     {% if request.form.get('priority','none')=='none'     %}selected{% endif %}>未入力</option>
                        <option value="critical" {% if request.form.get('priority')=='critical' %}selected{% endif %}>最優先</option>
                        <option value="high"     {% if request.form.get('priority')=='high'     %}selected{% endif %}>優先大</option>
                        <option value="low"      {% if request.form.get('priority')=='low'      %}selected{% endif %}>優先小</option>
                    </select>
                </div>

                <div class="row g-3 mb-3">
                    <!-- 実験種 -->
                    <div class="col-sm-6">
                        <label class="form-label">実験種</label>
                        <select class="form-select" name="experiment_type">
                            <option value="standard"   {% if request.form.get('experiment_type','standard')=='standard'   %}selected{% endif %}>標準</option>
                            <option value="experiment" {% if request.form.get('experiment_type')=='experiment' %}selected{% endif %}>実験</option>
                        </select>
                    </div>
                    <!-- 伝票発行済 -->
                    <div class="col-sm-6 d-flex align-items-end">
                        <div class="form-check" style="padding-left:2rem;margin-bottom:0.375rem;">
                            <input class="form-check-input" type="checkbox" name="invoice_issued"
                                   id="invoiceCheck" value="1"
                                   {% if request.form.get('invoice_issued') %}checked{% endif %}>
                            <label class="form-check-label" for="invoiceCheck">伝票発行済</label>
                        </div>
                    </div>
                </div>

                <!-- 作業者名 -->
                <div class="mb-3">
                    <label class="form-label">
                        <i class="bi bi-person me-1"></i>作業者名
                    </label>
                    <input type="text" class="form-control" name="worker_name"
                           list="contactsList"
                           placeholder="名前を入力またはアドレス帳から選択"
                           value="{{ request.form.get('worker_name','') }}">
                    <div class="form-text">アドレス帳に登録済みの名前は入力候補として表示されます</div>
                </div>

                <!-- ロット名 / 関連原料 -->
                <div class="row g-3 mb-3">
                    <div class="col-sm-6">
                        <label class="form-label">製造ロット名</label>
                        <input type="text" class="form-control" name="lot_name"
                               placeholder="例: A-2024-001"
                               value="{{ request.form.get('lot_name','') }}">
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label">関連原料</label>
                        <select class="form-select" name="material_id">
                            <option value="">— 選択してください —</option>
                            {% for m in materials %}
                            <option value="{{ m.id }}" {% if request.form.get('material_id')|string == m.id|string %}selected{% endif %}>
                                {{ m.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <!-- 予定日（登録時は予定のみ） -->
                <div class="row g-3 mb-4">
                    <div class="col-sm-6">
                        <label class="form-label"><i class="bi bi-calendar-event me-1"></i>開始予定日</label>
                        <input type="date" class="form-control" name="planned_start"
                               value="{{ request.form.get('planned_start','') }}">
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label"><i class="bi bi-calendar-check me-1"></i>完了予定日</label>
                        <input type="date" class="form-control" name="planned_end"
                               value="{{ request.form.get('planned_end','') }}">
                    </div>
                </div>
                <p class="text-secondary" style="font-size:0.8rem;margin-top:-8px;margin-bottom:16px;">
                    <i class="bi bi-info-circle me-1"></i>実際の開始日・完了日は作業開始後に編集画面から記録できます
                </p>

                <!-- メモ -->
                <div class="mb-4">
                    <label class="form-label">メモ</label>
                    <textarea class="form-control" name="notes" rows="3"
                              placeholder="備考など">{{ request.form.get('notes','') }}</textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> 登録
                    </button>
                    <a href="{{ url_for('work_orders') }}" class="btn btn-outline-secondary">キャンセル</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
