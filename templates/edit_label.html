{% extends "base.html" %}

{% block title %}ラベル編集 - 在庫管理システム{% endblock %}
{% block page_title %}ラベル編集{% endblock %}

{% block content %}
<div style="max-width:480px;">
    <div class="card">
        <div class="card-header">
            <i class="bi bi-pencil-square me-2 text-warning"></i>ラベル情報編集
        </div>
        <div class="card-body">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-4">
                    <label class="form-label">ラベル名 <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control"
                           value="{{ label.name }}" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">カラー</label>
                    <div class="d-flex align-items-center gap-3">
                        <input type="color" name="color" id="colorPicker"
                               class="form-control form-control-color"
                               value="{{ label.color }}" style="width:60px;height:38px;">
                        <span id="colorPreview" class="badge"
                              style="background-color:{{ label.color }};font-size:0.9rem;padding:6px 14px;">
                            {{ label.name }}
                        </span>
                    </div>
                    <div class="form-text">ラベルの表示色を変更できます</div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle me-1"></i>更新
                    </button>
                    <a href="{{ url_for('labels') }}" class="btn btn-outline-secondary">キャンセル</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
const picker = document.getElementById('colorPicker');
const preview = document.getElementById('colorPreview');
picker.addEventListener('input', function() {
    preview.style.backgroundColor = this.value;
});
</script>
{% endblock %}
